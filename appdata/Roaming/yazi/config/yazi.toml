[opener]
edit = [
	{ run = '${EDITOR:=nvim} "$@"', desc = "$EDITOR", block = true, for = "unix" },
	{ run = 'nvim "%*"', orphan = true, desc = "nvim", for = "windows" },
	{ run = 'nvim "%*"', block = true,  desc = "nvim (block)", for = "windows" },
]

play = [
	{ run = 'vlc "$@"', orphan = true, for = "unix" },
	{ run = 'PotPlayerMini64.exe" "%1"', orphan = true, for = "windows" },
	{ run = '''mediainfo "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]

[open]
rules = [
	{ mime = "application/epub+zip", use = [ "open", "reveal" ] },
	{ mime = "video/mp4", use = [ "play", "reveal" ] },
	{ mime = "application/pdf", use = [ "open", "reveal" ] },
	{ mime = "application/vnd.openxmlformats-officedocument.wordprocessingml.document", use = [ "open", "reveal" ] },
	{ mime = "application/msword", use = [ "open", "reveal" ] },
	{ mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", use = [ "open", "reveal" ] },
	{ mime = "application/vnd.ms-excel", use = [ "open", "reveal" ] },
	{ mime = "application/vnd.openxmlformats-officedocument.presentationml.presentation", use = [ "open", "reveal" ] },
	{ mime = "application/vnd.ms-powerpoint", use = [ "open", "reveal" ] },
	{ mime = "application/zip", use = [ "extract", "reveal" ] },

	{ mime = "audio/mpeg", use = [ "play", "reveal" ] },
]
